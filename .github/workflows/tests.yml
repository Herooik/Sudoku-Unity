name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The Unity editor image needs more disk than a hosted runner has free; drop preinstalled tools we never use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      # Re-importing the project from scratch is the slowest part of a Unity run.
      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # The Unity version is read from ProjectSettings/ProjectVersion.txt.
      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # We never read the coverage report, and its instrumentation plus -debugCodeOptimization costs memory.
          # Set through the CLI's GAME_CI_* environment fallback: the coverageEnabled input sends --no-coverageEnabled,
          # which CLI v0.1.72 rejects as an unknown argument.
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results
          # "latest" is resolved through an unauthenticated GitHub API call that hosted runners often hit the rate limit on.
          cliVersion: v0.1.72

      # Tells an out-of-memory kill apart from other causes when the job dies with "Killed" and no test results.
      - name: Show kernel OOM messages
        if: failure()
        run: sudo dmesg | grep -iE 'oom|killed process' || echo "No OOM messages in the kernel log."

      # The output is empty when the step failed before starting Unity, and upload-artifact rejects an empty path.
      - name: Upload test results
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v6
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
